name: Build LicenseGenerator (linux)

# Manual only, and only from main. This does not publish a GitHub release - it just
# uploads the built binary as a workflow artifact so it can be downloaded from the
# Actions run page. Artifacts self-delete after retention-days.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  RUNTIME_ID: linux-x64

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow only runs on main (ref was $GITHUB_REF)." >&2
          exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish LicenseGenerator
        run: |
          dotnet publish src/LicenseGenerator/LicenseGenerator.csproj \
            -c Release \
            -r "$RUNTIME_ID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/"$RUNTIME_ID"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LicenseGenerator-${{ env.RUNTIME_ID }}-${{ github.sha }}
          path: publish/${{ env.RUNTIME_ID }}
          retention-days: 7
          if-no-files-found: error
