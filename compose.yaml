name: license-server

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-license_server}
      POSTGRES_USER: ${POSTGRES_USER:-license_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - license-postgres:/var/lib/postgresql
    user: postgres
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    networks:
      - backend

  app:
    image: license-server-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      # Local-only opt-out: the seeded admin has no MFA enrolled, so requiring it here would hide
      # the Users page's "Add identity" panel. appsettings.Container.json defaults this to true
      # (matching the operator-runbook's "MFA required in production" policy) because the same
      # image and environment name ship to real deployments; only this Compose file overrides it.
      Security__RequireMfaForHighRiskPermissions: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-license_server};Username=${POSTGRES_USER:-license_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SEED_DEFAULT_ADMIN: ${SEED_DEFAULT_ADMIN:-true}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@localhost.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in .env}
      SEED_DEMO_LICENSE: ${SEED_DEMO_LICENSE:-true}
      Licensing__IdTimeZone: ${LICENSE_ID_TIME_ZONE:-Australia/Adelaide}
      Licensing__DefaultSigningKey: ${LICENSE_DEFAULT_SIGNING_KEY:-primary-2026}
      ActivationCodes__Pepper: ${ACTIVATION_CODE_PEPPER:?Set ACTIVATION_CODE_PEPPER in .env}
      ApiCredentials__Pepper: ${API_CREDENTIAL_PEPPER:?Set API_CREDENTIAL_PEPPER in .env}
      DeploymentKeys__Pepper: ${DEPLOYMENT_KEY_PEPPER:?Set DEPLOYMENT_KEY_PEPPER in .env}
      MailerSend__ApiToken: ${MAILERSEND_API_TOKEN:?Set MAILERSEND_API_TOKEN in .env}
      MailerSend__FromEmail: ${MAILERSEND_FROM_EMAIL:?Set MAILERSEND_FROM_EMAIL in .env}
      MailerSend__FromName: ${MAILERSEND_FROM_NAME:-License Server}
      MailerSend__WebhookSecret: ${MAILERSEND_WEBHOOK_SECRET:?Set MAILERSEND_WEBHOOK_SECRET in .env}
      Stripe__ApiKey: ${STRIPE_API_KEY:?Set STRIPE_API_KEY in .env}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
      Stripe__ApiVersion: 2026-07-29.dahlia
      Billing__GracePeriodDays: ${BILLING_GRACE_PERIOD_DAYS:-7}
      Billing__RefundAction: ${BILLING_REFUND_ACTION:-review}
      Billing__DisputeAction: ${BILLING_DISPUTE_ACTION:-review}
      CustomerPortal__PublicBaseUrl: ${CUSTOMER_PORTAL_PUBLIC_BASE_URL:?Set CUSTOMER_PORTAL_PUBLIC_BASE_URL in .env}
      # Trust only the reverse proxy hop(s) in front of the app before honoring X-Forwarded-For /
      # X-Forwarded-Proto. Leave blank when exposing the container directly instead of via a proxy.
      Security__ForwardedHeaders__KnownProxies__0: ${FORWARDED_HEADERS_KNOWN_PROXY:-}
      Security__ForwardedHeaders__KnownNetworks__0: ${FORWARDED_HEADERS_KNOWN_NETWORK:-}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}
      # Deliberately not setting ASPNETCORE_FORWARDEDHEADERS_ENABLED: that variable makes the
      # framework add its own ForwardedHeaders middleware using framework-default options (which
      # trust loopback unconditionally) regardless of whether KnownProxies/KnownNetworks above are
      # configured - bypassing the app's own explicit, config-gated forwarded-header trust entirely.
      # Only Program.cs's gated app.UseForwardedHeaders() call should ever add this middleware.
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - license-data-protection:/var/lib/licenseserver/data-protection
      - ${LICENSE_SIGNING_KEY_DIR:?Set LICENSE_SIGNING_KEY_DIR in .env}:/var/lib/licenseserver/keys:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    networks:
      - backend

volumes:
  license-postgres:
  license-data-protection:

networks:
  backend:
    # PostgreSQL is not published; the app still needs host ingress and production HTTPS proxying.
    internal: false
